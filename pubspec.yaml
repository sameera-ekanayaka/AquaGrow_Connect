name: aquagrow_mobile
description: "AquaGrow Connect: the companion app for the AquaGrow modular hydroponic pod."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# ---------------------------------------------------------------------------
# RULE: only the foundation owner (Tharindu) or Sameera edits this file.
# Need a package? Ask in the group first. See CONTRIBUTING.md.
# Every package below is already used, or reserved for a named task.
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # State management and navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Cloud backend and security
  supabase_flutter: ^2.5.6
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0 # biometric unlock before pump/light commands

  # Offline cache and network awareness
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.3 # offline banner + sync trigger

  # Device hardware (lecture 8)
  geolocator: ^12.0.0
  sensors_plus: ^5.0.1 # shake to refresh
  flutter_local_notifications: ^17.2.1 # alert notifications
  url_launcher: ^6.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  share_plus: ^10.0.0

  # Networking
  http: ^1.2.1

  # Charts, QR and formatting
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  crypto: ^3.0.3 # SHA-256 hash for the Harvest Passport QR
  uuid: ^4.4.0

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/crops/

  # Plus Jakarta Sans from the Minimal UI Figma file, bundled so the demo phone
  # needs no network (OFL licence in assets/fonts/OFL.txt).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
